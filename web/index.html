<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>AST Viewer — c2py</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --line:#d9d9d4; --text:#1f2328; --muted:#6b6f76; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:grid; grid-template-rows:auto 1fr; height:100vh; }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line);
           background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button, label.btn { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px;
                      background:#fff; cursor:pointer; }
  button:hover, label.btn:hover { background:#f0f0ec; }
  .legend { display:flex; gap:12px; margin-left:auto; color:var(--muted); font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  main { display:grid; grid-template-columns: 1fr 420px; min-height:0; }
  #view { position:relative; overflow:hidden; cursor:grab; }
  #view.drag { cursor:grabbing; }
  svg { width:100%; height:100%; display:block; }
  .edge { fill:none; stroke:#b9bbb5; stroke-width:1.3; }
  .node rect { stroke-width:1.2; rx:6; }
  .node text { font:12px ui-monospace, Menlo, Consolas, monospace; dominant-baseline:central; text-anchor:middle;
               pointer-events:none; }
  .node { cursor:pointer; }
  .node.collapsed rect { stroke-dasharray:4 2; stroke-width:2; }
  .node.hl rect { stroke:#111 !important; stroke-width:2.5; }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; flex:1; padding:9px; background:#fafaf8; }
  .tabs button.on { background:#fff; font-weight:600; box-shadow: inset 0 -2px 0 #4a6cf7; }
  pre { margin:0; padding:10px 0; overflow:auto; flex:1; font:12.5px/1.55 ui-monospace, Menlo, Consolas, monospace; }
  pre div { padding:0 12px; white-space:pre; }
  pre div.hl { background:#fff2b3; }
  pre span.ln { display:inline-block; width:2.5em; color:#aaa; user-select:none; }
  #tip { position:absolute; pointer-events:none; background:#222; color:#fff; padding:4px 8px; border-radius:4px;
         font-size:12px; display:none; white-space:nowrap; }
  #hint { position:absolute; left:12px; bottom:10px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>AST Viewer</h1>
  <button id="expand">Розгорнути все</button>
  <button id="collapse">Згорнути до функцій</button>
  <button id="fit">Вмістити</button>
  <label class="btn">Відкрити ast.json<input type="file" id="file" accept=".json" hidden></label>
  <span id="stats" style="color:var(--muted)"></span>
  <div class="legend">
    <span><i style="background:#e4dcfb"></i>програма/функції</span>
    <span><i style="background:#dbe8fb"></i>інструкції</span>
    <span><i style="background:#fde6cf"></i>оператори</span>
    <span><i style="background:#d5f1e2"></i>змінні/виклики</span>
    <span><i style="background:#f1f1ee"></i>літерали</span>
  </div>
</header>
<main>
  <div id="view">
    <svg id="svg"><g id="scene"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="tip"></div>
    <div id="hint">Клік по вузлу — згорнути/розгорнути · колесо — масштаб · перетягування — зсув</div>
  </div>
  <aside>
    <div class="tabs"><button class="on" data-t="src">Вихідний код C</button><button data-t="py">Згенерований Python</button></div>
    <pre id="code"></pre>
  </aside>
</main>

<script src="ast_data.js"></script>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const COLORS = {
  fn:   ["#e4dcfb", "#7b61d1"], stmt: ["#dbe8fb", "#4a78c9"], op: ["#fde6cf", "#d98a3a"],
  ref:  ["#d5f1e2", "#3a9a68"], lit:  ["#f1f1ee", "#9a9a92"]
};
const CAT = {
  Program:"fn", Function:"fn", Params:"fn", Param:"fn",
  Assign:"op", BinOp:"op", UnOp:"op", IncDec:"op",
  Var:"ref", Call:"ref", VarInit:"ref",
  Int:"lit", Float:"lit", String:"lit"
};
const NODE_H = 26, GAP_X = 14, GAP_Y = 58, CHAR_W = 7.3;

let root, nextId = 0;
let tx = 40, ty = 30, scale = 1;               // камера (зсув + масштаб)
const svg = document.getElementById("svg"), scene = document.getElementById("scene");
const gNodes = document.getElementById("nodes"), gEdges = document.getElementById("edges");
const tip = document.getElementById("tip");

/* ---------- підготовка дерева ---------- */
function prepare(d, depth = 0, parent = null) {
  const n = { data: d, id: nextId++, depth, parent, collapsed: false, x: 0, y: 0, px: null, py: null };
  n.label = d.label.length > 34 ? d.label.slice(0, 33) + "…" : d.label;
  n.children = (d.children || []).map(c => prepare(c, depth + 1, n));
  return n;
}
const visible = n => n.collapsed ? [] : n.children;

/* ---------- компонування: ширина піддерева = max(власна, сума дітей) ---------- */
const text = n => n.label + (n.collapsed && n.children.length ? `  [+${n.children.length}]` : "");
function measure(n) {
  n.w = Math.max(44, text(n).length * CHAR_W + 18);
  const ch = visible(n);
  const sum = ch.reduce((s, c) => s + measure(c), 0) + GAP_X * Math.max(0, ch.length - 1);
  return n.sw = Math.max(n.w, sum);
}
function place(n, left) {
  n.x = left + n.sw / 2;
  n.y = n.depth * GAP_Y;
  const ch = visible(n);
  const sum = ch.reduce((s, c) => s + c.sw, 0) + GAP_X * Math.max(0, ch.length - 1);
  let x = left + (n.sw - sum) / 2;
  for (const c of ch) { place(c, x); x += c.sw + GAP_X; }
}
function walk(n, f) { f(n); visible(n).forEach(c => walk(c, f)); }

/* ---------- малювання з анімацією переходів ---------- */
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function render(animate = true) {
  measure(root); place(root, 0);
  const list = []; walk(root, n => list.push(n));
  gNodes.textContent = ""; gEdges.textContent = "";
  let count = 0; walk(root, () => count++);
  document.getElementById("stats").textContent = `вузлів показано: ${count}`;

  const items = list.map(n => {
    const [fill, stroke] = COLORS[CAT[n.data.kind] || "stmt"];
    const g = el("g", { class: "node" + (n.collapsed && n.children.length ? " collapsed" : "") }, gNodes);
    el("rect", { x: -n.w / 2, y: -NODE_H / 2, width: n.w, height: NODE_H, fill, stroke }, g);
    const t = el("text", {}, g);
    t.textContent = text(n);
    g.addEventListener("click", ev => { ev.stopPropagation(); if (n.children.length) { n.collapsed = !n.collapsed; render(); } });
    g.addEventListener("mouseenter", () => hover(n, g, true));
    g.addEventListener("mouseleave", () => hover(n, g, false));
    const path = n.parent ? el("path", { class: "edge" }, gEdges) : null;
    // стартова позиція: попередня, або позиція батька (для нових вузлів)
    const sx = n.px ?? (n.parent ? n.parent.px ?? n.parent.x : n.x);
    const sy = n.py ?? (n.parent ? n.parent.py ?? n.parent.y : n.y);
    return { n, g, path, sx, sy };
  });

  const t0 = performance.now(), dur = animate ? 280 : 0;
  function frame(now) {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    for (const it of items) {
      it.n.cx = it.sx + (it.n.x - it.sx) * e;
      it.n.cy = it.sy + (it.n.y - it.sy) * e;
      it.g.setAttribute("transform", `translate(${it.n.cx},${it.n.cy})`);
    }
    for (const it of items) if (it.path) {
      const p = it.n.parent, x1 = p.cx, y1 = p.cy + NODE_H / 2, x2 = it.n.cx, y2 = it.n.cy - NODE_H / 2, my = (y1 + y2) / 2;
      it.path.setAttribute("d", `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    }
    if (k < 1) requestAnimationFrame(frame);
    else list.forEach(n => { n.px = n.x; n.py = n.y; });
  }
  requestAnimationFrame(frame);
}

/* ---------- підсвічування рядка коду + підказка ---------- */
function hover(n, g, on) {
  g.classList.toggle("hl", on);
  document.querySelectorAll("#code div.hl").forEach(d => d.classList.remove("hl"));
  tip.style.display = on ? "block" : "none";
  if (!on) return;
  tip.textContent = `${n.data.kind}: ${n.data.label}  ·  рядок ${n.data.line}  ·  дітей: ${n.children.length}`;
  const r = g.getBoundingClientRect(), v = document.getElementById("view").getBoundingClientRect();
  tip.style.left = (r.left - v.left) + "px";
  tip.style.top = (r.bottom - v.top + 6) + "px";
  if (tab === "src") {
    const line = document.querySelector(`#code div[data-l="${n.data.line}"]`);
    if (line) { line.classList.add("hl"); line.scrollIntoView({ block: "nearest" }); }
  }
}

/* ---------- камера: зсув і масштаб ---------- */
function applyCam() { scene.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`); }
function fit() {
  measure(root); place(root, 0);
  let maxY = 0; walk(root, n => maxY = Math.max(maxY, n.y));
  const W = svg.clientWidth, H = svg.clientHeight;
  scale = Math.min(1.4, (W - 40) / root.sw, (H - 60) / (maxY + NODE_H));
  tx = (W - root.sw * scale) / 2; ty = 30;
  applyCam();
}
const view = document.getElementById("view");
let drag = null;
view.addEventListener("mousedown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; view.classList.add("drag"); });
window.addEventListener("mouseup", () => { drag = null; view.classList.remove("drag"); });
window.addEventListener("mousemove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; applyCam(); } });
view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015), ns = Math.min(4, Math.max(0.1, scale * k));
  tx = mx - (mx - tx) * ns / scale; ty = my - (my - ty) * ns / scale; scale = ns;
  applyCam();
}, { passive: false });

/* ---------- панель коду ---------- */
let tab = "src", SRC_TEXT = typeof SRC !== "undefined" ? SRC : "", PY_TEXT = typeof PY !== "undefined" ? PY : "";
function showCode() {
  const pre = document.getElementById("code");
  pre.textContent = "";
  (tab === "src" ? SRC_TEXT : PY_TEXT).split("\n").forEach((s, i) => {
    const d = document.createElement("div");
    d.dataset.l = i + 1;
    d.innerHTML = `<span class="ln">${i + 1}</span>`;
    d.appendChild(document.createTextNode(s));
    pre.appendChild(d);
  });
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.t; showCode();
});

/* ---------- кнопки ---------- */
function setAll(f) { (function rec(n) { f(n); n.children.forEach(rec); })(root); render(); }
document.getElementById("expand").onclick = () => setAll(n => n.collapsed = false);
document.getElementById("collapse").onclick = () => setAll(n => n.collapsed = n.data.kind === "Function");
document.getElementById("fit").onclick = fit;
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { load(JSON.parse(t)); SRC_TEXT = "(вихідний код недоступний для завантаженого json)"; PY_TEXT = ""; showCode(); });
};

function load(data) {
  nextId = 0; root = prepare(data);
  // велике дерево: спершу показуємо лише функції (їх можна розгорнути кліком)
  if (nextId > 80) (function rec(n) { n.collapsed = n.data.kind === "Function"; n.children.forEach(rec); })(root);
  render(false); fit();
}

if (typeof AST !== "undefined") { load(AST); showCode(); }
else document.getElementById("stats").textContent = "Немає ast_data.js — запустіть ./c2py program.c або відкрийте ast.json";
window.addEventListener("resize", fit);
</script>
</body>
</html>
